<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Instrument+Sans:wght@600;700&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #e9ecf1; font-family: "Instrument Sans", sans-serif; display: grid; grid-template-columns: 560px 1fr; align-items: center; gap: 56px; padding: 0 72px; box-sizing: border-box; }
  .tag { background: #fff; border-radius: 22px; box-shadow: 0 2px 0 rgba(20,30,50,.06), 0 18px 40px -16px rgba(20,30,50,.35); overflow: hidden; transform: rotate(-3deg); }
  .band { background: #d42a35; color: #fff; text-align: center; padding: 22px 0 16px; }
  .band b { display: block; font-size: 84px; letter-spacing: .06em; line-height: 1; }
  .band span { font-size: 22px; letter-spacing: .2em; text-transform: uppercase; font-weight: 600; }
  .write { font-family: "Permanent Marker", cursive; color: #1a2a6c; font-size: 104px; text-align: center; padding: 30px 0 38px; line-height: 1; }
  h1 { font-family: "Permanent Marker", cursive; color: #1a2a6c; font-size: 76px; line-height: 1; margin: 0 0 22px; font-weight: 400; }
  p { font-size: 34px; line-height: 1.3; color: #1b1f27; margin: 0; font-weight: 600; }
  p.sub { color: #5d6573; font-size: 26px; margin-top: 18px; }
</style></head>
<body>
  <div class="tag"><div class="band"><b>HELLO</b><span>my name is</span></div><div class="write">To Do Machine</div></div>
